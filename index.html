<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Конспекты</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='24' font-size='24'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f4f6f8;--side:#fff;--line:#e4e8ee;--ink:#1f2530;--mut:#697380;--acc:#2456c8;--acc2:#eef3fd}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.62 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
a{color:inherit;text-decoration:none}
.app{display:flex;min-height:100vh}

.sb{width:264px;flex:0 0 264px;background:var(--side);border-right:1px solid var(--line);
    position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 0 30px}
.brand{display:flex;gap:10px;align-items:center;padding:0 18px 14px;border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:9px;background:var(--acc);color:#fff;display:flex;
      align-items:center;justify-content:center;font-size:17px;flex:0 0 34px}
.brand b{font-size:16px;display:block;line-height:1.2}
.brand span{font-size:11.5px;color:var(--mut)}
nav{padding:10px 10px 0}
.nv{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;font-size:14px;
    color:var(--ink);cursor:pointer;user-select:none}
.nv:hover{background:var(--acc2)}
.nv.on{background:var(--acc2);color:var(--acc);font-weight:600}
.nv .cnt{margin-left:auto;font-size:11px;color:var(--mut);background:var(--bg);
         border-radius:99px;padding:1px 7px}
.nv .ic{width:18px;text-align:center;flex:0 0 18px}
.sbh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);
     padding:16px 20px 6px}
.sbf{margin-top:18px;padding:12px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;background:rgba(244,246,248,.92);backdrop-filter:blur(6px);
     border-bottom:1px solid var(--line);padding:12px 26px;display:flex;gap:12px;align-items:center;z-index:5}
.burger{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;
        padding:7px 10px;font-size:15px;cursor:pointer}
.search{flex:1;display:flex;gap:8px;max-width:640px}
.search input{flex:1;padding:10px 14px;border:1px solid var(--line);border-radius:9px;
              font:inherit;background:#fff;outline:none}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(36,86,200,.12)}
.search button{padding:10px 18px;border:0;border-radius:9px;background:var(--acc);
               color:#fff;font:inherit;cursor:pointer}
.search button:disabled{opacity:.6}
.crumb{font-size:12.5px;color:var(--mut)}
.crumb a{color:var(--acc)}
.body{padding:26px;max-width:980px;width:100%;margin:0 auto}

.hero h1{font-size:26px;margin:0 0 6px}
.hero p{color:var(--mut);margin:0 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 8px}
.chip{padding:7px 13px;border:1px solid var(--line);background:#fff;border-radius:99px;
      font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.h2{font-size:15px;font-weight:650;margin:26px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.c{background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 15px;display:block}
.c:hover{border-color:var(--acc);box-shadow:0 1px 6px rgba(31,37,48,.06)}
.c h3{margin:0 0 4px;font-size:11.5px;font-weight:600;color:var(--mut);text-transform:none}
.c p{margin:0;font-size:14px;color:var(--ink)}

.art{background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px 30px;max-width:820px}
.art h1{margin:0 0 4px;font-size:23px;line-height:1.3}
.art .meta{color:var(--mut);font-size:13px;margin-bottom:18px}
.art .txt{font-size:15.5px;line-height:1.75;white-space:pre-wrap}
.code{font-family:ui-monospace,Consolas,monospace;font-size:13px;background:#f2f4f7;
      border-radius:8px;padding:12px;overflow:auto;white-space:pre}
.rel{margin-top:24px}
.rel h2{font-size:14px;color:var(--mut);margin:0 0 10px}
.rel a{display:block;background:#fff;border:1px solid var(--line);border-radius:8px;
       padding:9px 13px;margin-bottom:6px;font-size:14px}
.rel a span{color:var(--mut);font-size:12px;margin-left:6px}
.note{font-size:12.5px;color:var(--mut);margin-top:14px}
.hide{display:none!important}

@media (max-width:860px){
 .app{display:block}
 .sb{position:fixed;left:0;top:0;z-index:30;transform:translateX(-100%);transition:transform .2s;
     box-shadow:0 0 40px rgba(0,0,0,.15)}
 .sb.open{transform:none}
 .burger{display:block}
 .body{padding:18px}
 .art{padding:18px}
}
</style>
</head>
